<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MAYAMA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{width:100%;height:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;padding:6px 8px;gap:4px;overflow:hidden}
h1{font-size:clamp(18px,4.2dvh,29px);line-height:1;margin:0;font-weight:950;letter-spacing:.18em;flex:0 0 auto}
.desc{font-size:clamp(8px,1.7dvh,11px);line-height:1.1;color:#9ba3af;flex:0 0 auto}
.hud{width:min(90vw,390px);display:flex;justify-content:space-between;align-items:center;background:#151922;border:1px solid #343b47;border-radius:9px;padding:4px 11px;flex:0 0 auto}
.hud small{display:block;color:#858e9b;font-size:7px;letter-spacing:.12em;line-height:1}.score{font-size:clamp(15px,3dvh,21px);line-height:1.05;font-weight:900}.chain{color:#ffd43b;font-size:clamp(10px,2dvh,15px);font-weight:900}
.board{position:relative;flex:0 1 auto;height:calc(100dvh - 145px);width:calc((100dvh - 145px)*8/14);max-height:68dvh;max-width:90vw;min-height:0;padding:3px;background:#06080b;border:1px solid #3a424f;border-radius:9px}
.grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(14,1fr);gap:1.5px}
.cell{background:#292f39;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,4.8dvh,25px);font-weight:950;min-width:0;min-height:0}
.cell.falling{background:#ffd43b;color:#111;box-shadow:inset 0 0 0 2px #fff}
.cell.flash{background:#fff;color:#111;animation:pop .18s forwards}
@keyframes pop{to{opacity:0;transform:scale(.15)}}
.controls{width:min(90vw,390px);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;flex:0 0 auto}
button{height:clamp(34px,6.5dvh,50px);border:0;border-radius:8px;background:#272e38;color:#fff;font-size:clamp(17px,3.8dvh,24px);font-weight:900;touch-action:manipulation}
button:active{background:#3b4451;transform:scale(.96)}
.help{font-size:7px;line-height:1;color:#68717e;flex:0 0 auto}
.overlay{display:none;position:absolute;inset:3px;border-radius:6px;background:#090b10ed;z-index:10;align-items:center;justify-content:center;flex-direction:column}
.overlay.show{display:flex}.go{font-size:clamp(20px,5dvh,30px);font-weight:950}.final{color:#ffd43b;font-weight:900;margin:6px 0 12px}.restart{width:auto;padding:0 20px;font-size:12px}
@media(max-height:520px){
 .app{padding:3px 6px;gap:2px}.desc{display:none}.hud{padding:3px 9px}.board{height:calc(100dvh - 88px);width:calc((100dvh - 88px)*8/14)}.controls button{height:30px}.help{display:none}
}
</style>
</head>
<body>
<div class="app">
<h1>MAYAMA</h1>
<div class="desc">M・A・Y をつないで MAYAMA を作れ</div>
<div class="hud">
  <div><small>SCORE</small><div class="score" id="score">0</div></div>
  <div class="chain" id="chain"></div>
</div>
<div class="board">
  <div id="grid" class="grid"></div>
  <div id="overlay" class="overlay">
    <div class="gameover">GAME OVER</div>
    <div class="final">SCORE <span id="final">0</span></div>
    <button class="restart" id="restart">もう一度</button>
  </div>
</div>
<div class="controls">
<button data-a="left">←</button>
<button data-a="rotate">↻</button>
<button data-a="down">↓</button>
<button data-a="right">→</button>
<button data-a="drop">⤓</button>
</div>
<div class="help">← → 移動　↻ 回転　↓ 1段　⤓ 即落下</div>
</div>

<script>
const W=8,H=14,TARGET="MAYAMA";
let board,piece,score,chain,busy,over,timer;

function empty(){return Array.from({length:H},()=>Array(W).fill(null))}
function rand(){return "MAY"[Math.floor(Math.random()*3)]}

/*
  落下ピースは「2個の独立した正方形オブジェクト」。
  piece.cells は各セルの相対座標と文字を持つ。
  固定すると board の各セルへ別々のオブジェクトとして格納する。
*/
function newPiece(){
  const letters=["M","A","Y"];
  const a=letters[Math.floor(Math.random()*3)];
  const b=letters[Math.floor(Math.random()*3)];
  return {
    x:3,y:0,r:0,
    cells:[{x:0,y:0,l:a},{x:0,y:1,l:b}],
    id:Math.random().toString(36).slice(2)
  };
}
function pieceCells(p){
  if(p.r%2===0)return p.cells.map(c=>({x:p.x+c.x,y:p.y+c.y,l:c.l}));
  // clockwise rotation: vertical -> horizontal
  return p.cells.map(c=>({x:p.x-c.y+1,y:p.y+c.x,l:c.l}));
}
function valid(p){
  return pieceCells(p).every(c=>c.x>=0&&c.x<W&&c.y>=0&&c.y<H&&!board[c.y][c.x]);
}
function render(match=[]){
  const g=document.getElementById("grid");g.innerHTML="";
  const f=new Map(pieceCells(piece).map(c=>[c.x+","+c.y,c]));
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const d=document.createElement("div");d.className="cell";const k=x+","+y;
    if(board[y][x])d.textContent=board[y][x].l;
    if(f.has(k)){d.textContent=f.get(k).l;d.classList.add("falling")}
    if(match.includes(k))d.classList.add("flash");
    g.appendChild(d);
  }
  document.getElementById("score").textContent=score;
}
function move(dx){
  if(over||busy)return;
  const p={...piece,x:piece.x+dx};
  if(valid(p)){piece=p;render()}
}
function rotate(){
  if(over||busy)return;
  const p={...piece,r:(piece.r+1)%4};
  if(valid(p)){piece=p;render();return}
  for(const dx of [-1,1,-2,2]){
    const q={...p,x:p.x+dx};if(valid(q)){piece=q;render();return}
  }
}
function down(){
  if(over||busy)return;
  const p={...piece,y:piece.y+1};
  if(valid(p)){piece=p;render()}else lock()
}
function hardDrop(){
  if(over||busy)return;
  while(valid({...piece,y:piece.y+1}))piece.y++;
  render();lock()
}
function lock(){
  const cs=pieceCells(piece);
  if(!cs.every(c=>c.y>=0&&c.y<H)){end();return}
  cs.forEach(c=>board[c.y][c.x]={l:c.l,id:Math.random().toString(36).slice(2)});
  piece=newPiece();
  if(!valid(piece)){end();return}
  render();resolve();
}
function neighbors(x,y){
 return [[x+1,y],[x-1,y],[x,y+1],[x,y-1]]
 .filter(([a,b])=>a>=0&&a<W&&b>=0&&b<H);
}

/*
  MAYAMA は「M→A→Y→A→M→A」の6個の独立セルを、
  4方向の隣接だけでたどれる場合に成立。
  同じセルは1つの経路内で再利用しない。
*/
function findMatches(){
 const found=new Set();
 for(let sy=0;sy<H;sy++)for(let sx=0;sx<W;sx++){
  if(!board[sy][sx]||board[sy][sx].l!=="M")continue;
  function dfs(x,y,i,path){
   if(i===TARGET.length-1){
    path.forEach(([a,b])=>found.add(a+","+b));return;
   }
   for(const [nx,ny] of neighbors(x,y)){
    if(!board[ny][nx]||board[ny][nx].l!==TARGET[i+1])continue;
    if(path.some(([a,b])=>a===nx&&b===ny))continue;
    dfs(nx,ny,i+1,path.concat([[nx,ny]]));
   }
  }
  dfs(sx,sy,0,[[sx,sy]]);
 }
 return [...found];
}

/* 消去後、各列のセルを下へ詰める。浮いたセルはすべて落下する。 */
function gravity(){
 for(let x=0;x<W;x++){
  const col=[];
  for(let y=H-1;y>=0;y--)if(board[y][x])col.push(board[y][x]);
  for(let y=H-1;y>=0;y--)board[y][x]=col[H-1-y]||null;
 }
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function resolve(){
 busy=true;chain=0;
 while(true){
  const m=findMatches();
  if(!m.length)break;
  chain++;
  document.getElementById("chain").textContent=chain>1?`${chain} CHAIN!`:"";
  render(m);await wait(190);
  m.forEach(k=>{const[x,y]=k.split(",").map(Number);board[y][x]=null});
  score+=m.length*100*chain;
  render();await wait(70);
  gravity();render();await wait(110);
 }
 document.getElementById("chain").textContent="";
 busy=false;
}
function end(){
 over=true;clearInterval(timer);
 document.getElementById("final").textContent=score;
 document.getElementById("overlay").classList.add("show");
 render();
}
function restart(){
 board=empty();score=0;chain=0;busy=false;over=false;
 document.getElementById("overlay").classList.remove("show");
 piece=newPiece();render();
 clearInterval(timer);timer=setInterval(down,650);
}
document.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>{
 const a=b.dataset.a;
 if(a==="left")move(-1);if(a==="right")move(1);if(a==="rotate")rotate();
 if(a==="down")down();if(a==="drop")hardDrop();
}));
document.getElementById("restart").addEventListener("click",restart);
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"){e.preventDefault();move(-1)}
 else if(e.key==="ArrowRight"){e.preventDefault();move(1)}
 else if(e.key==="ArrowUp"){e.preventDefault();rotate()}
 else if(e.key==="ArrowDown"){e.preventDefault();down()}
 else if(e.code==="Space"){e.preventDefault();hardDrop()}
 else if(e.key.toLowerCase()==="r")restart();
});
restart();
</script>

<script>
function fitBoard(){
  const app=document.querySelector('.app');
  const board=document.querySelector('.board');
  if(!app||!board)return;
  const vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
  const fixed=[...app.children].filter(el=>el!==board);
  let used=0;
  fixed.forEach(el=>used+=el.getBoundingClientRect().height);
  const gap=parseFloat(getComputedStyle(app).gap)||0;
  used += gap*(app.children.length-1);
  const padding=parseFloat(getComputedStyle(app).paddingTop)+parseFloat(getComputedStyle(app).paddingBottom);
  const available=Math.max(160,vh-used-padding-2);
  const maxW=Math.min(window.innerWidth*.90,390);
  const h=Math.min(available,maxW*14/8);
  board.style.height=Math.floor(h)+'px';
  board.style.width=Math.floor(h*8/14)+'px';
}
window.addEventListener('resize',fitBoard);
window.addEventListener('orientationchange',()=>setTimeout(fitBoard,100));
if(window.visualViewport)window.visualViewport.addEventListener('resize',fitBoard);
document.addEventListener('DOMContentLoaded',fitBoard);
setTimeout(fitBoard,100);
</script>
</body>
</html>
