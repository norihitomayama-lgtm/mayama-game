<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#f8f9fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{height:100%;height:100dvh;width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(2px,.65dvh,6px);padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom);overflow:hidden}
h1{font-size:clamp(18px,3.5dvh,28px);line-height:1;margin:3px 0 0;font-weight:950;letter-spacing:.18em;flex:0 0 auto}
.subtitle{font-size:clamp(8px,1.45dvh,11px);color:#9ba3af;flex:0 0 auto}

small{display:block;color:#858e9b;font-size:7px;letter-spacing:.12em}.score{font-size:clamp(15px,2.6dvh,21px);line-height:1.1;font-weight:900}.chain{color:#ffd43b;font-weight:900;font-size:clamp(10px,1.8dvh,14px)}
.play-area{display:flex;align-items:stretch;justify-content:center;gap:6px;min-height:0;flex:1 1 auto;width:100%}
.board{position:relative;flex:0 1 auto;min-height:0;height:100%;aspect-ratio:8/14;width:auto;max-width:calc(100% - 82px);padding:3px;background:#05070a;border:1px solid #3a424f;border-radius:9px}
.grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(14,minmax(0,1fr));gap:1.5px}
.cell{min-width:0;min-height:0;background:#292f39;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,3.1dvh,24px);font-weight:950;line-height:1}
.cell.falling{background:#ffd43b;color:#101216;box-shadow:inset 0 0 0 1.5px #fff}
.cell.hint{outline:2px solid #53e0c1;outline-offset:-2px;background:#17483f!important;color:#fff!important;box-shadow:0 0 8px #53e0c188;z-index:1}
.cell.flash{position:relative;z-index:3;background:#fff!important;color:#111!important;box-shadow:0 0 12px #fff,0 0 24px #ffd43b;animation:clear-pop .42s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes clear-pop{0%{opacity:1;transform:scale(1);filter:brightness(1)}18%{opacity:1;transform:scale(1.22);filter:brightness(2)}48%{opacity:1;transform:scale(1.08);filter:brightness(1.7)}100%{opacity:0;transform:scale(.08) rotate(12deg);filter:brightness(2)}}
.board.clear-shake{animation:board-shake .34s ease-out}
@keyframes board-shake{0%,100%{transform:translate(0,0)}18%{transform:translate(-3px,1px)}36%{transform:translate(3px,-1px)}54%{transform:translate(-2px,0)}72%{transform:translate(2px,1px)}}
.fx-layer{position:absolute;inset:3px;z-index:8;pointer-events:none;overflow:hidden;border-radius:7px}
.fx-particle{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffd43b;box-shadow:0 0 7px #ffd43b;animation:particle-burst .48s ease-out forwards}
.fx-particle.white{background:#fff;box-shadow:0 0 8px #fff}
@keyframes particle-burst{0%{opacity:1;transform:translate(0,0) scale(1.2)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.1)}}
.clear-callout{position:absolute;left:50%;top:43%;z-index:9;transform:translate(-50%,-50%) scale(.55);white-space:nowrap;color:#ffd43b;font-weight:1000;font-size:clamp(18px,4dvh,30px);font-style:italic;letter-spacing:.08em;text-shadow:0 2px 0 #111,0 0 8px #ffd43b,0 0 22px #ff9f1c;animation:callout .72s cubic-bezier(.15,.8,.2,1) forwards;pointer-events:none}
.clear-callout.combo{color:#fff;text-shadow:0 0 8px #fff,0 0 20px #ffd43b}
@keyframes callout{0%{opacity:0;transform:translate(-50%,-50%) scale(.45) rotate(-5deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(2deg)}32%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1.08)}}
.side{width:68px;flex:0 0 68px;display:flex;flex-direction:column;gap:5px}

.mini.empty{background:#292f39;color:#fff}
.controls{width:min(92vw,400px);display:flex;justify-content:space-between;gap:12px;flex:0 0 auto}
 .control-group{display:grid;gap:5px;align-items:stretch}
 .move-group{grid-template-columns:repeat(3,minmax(0,1fr));width:60%}
 .action-group{grid-template-columns:repeat(2,minmax(0,1fr));width:36%}
 .control-group button{height:clamp(40px,7dvh,52px);font-size:clamp(18px,3.5dvh,24px)}
 .control-label{font-size:8px;color:#8993a1;text-align:center;letter-spacing:.08em;font-weight:800}
button{border:0;border-radius:8px;background:#272e38;color:#fff;height:clamp(32px,6.1dvh,47px);font-size:clamp(17px,3.4dvh,23px);font-weight:900;touch-action:manipulation}
button:active{background:#3b4451;transform:scale(.97)}
button.utility{font-size:clamp(10px,1.8dvh,13px);height:clamp(28px,4.8dvh,36px)}
.bottom-row{display:flex;gap:6px;justify-content:center;flex:0 0 auto;width:min(92vw,400px)}
.bottom-row button{min-width:92px}

.overlay{position:absolute;inset:3px;border-radius:6px;background:#090b10f5;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:8px 10px;overflow-y:auto;gap:0}
.overlay.hidden{display:none}
.overlay h2{font-size:clamp(22px,4.7dvh,31px);letter-spacing:.04em;margin:0 0 4px}
.overlay p{font-size:clamp(10px,1.55dvh,12px);color:#c0c7d1;margin:0 0 10px;line-height:1.65;max-width:280px}.quick-rule{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#303845;color:#ffd43b;font-size:9px;font-weight:900;margin-right:4px}.overlay .result-stats{font-size:clamp(12px,2dvh,15px);line-height:1.8;font-weight:800;color:#f8f9fb}
#modePicker{width:100%;gap:6px!important;margin:0 0 5px!important;flex-wrap:nowrap!important}
#modePicker button{width:50%;padding:0 4px;font-size:clamp(10px,1.7dvh,12px);height:clamp(34px,5.4dvh,42px);border:1px solid #454d5b}
#modeDescription{font-size:clamp(9px,1.35dvh,10px)!important;line-height:1.35;margin:0 0 7px!important;max-width:220px}
#startBtn{width:100%;max-width:220px;height:clamp(38px,6dvh,46px);font-size:clamp(12px,2dvh,15px);letter-spacing:.02em}
#rankingBtn{margin-top:7px;height:clamp(29px,4.5dvh,35px);font-size:10px;padding:0 12px}

.overlay button{height:38px;padding:0 18px;font-size:12px;background:#ffd43b;color:#111;flex:0 0 auto}.overlay .secondary{background:#343b47;color:#fff}.rank-form{display:none;width:100%;max-width:260px;gap:6px;margin:0 0 8px}.rank-form.show{display:flex;flex-direction:column}.rank-form input{width:100%;height:34px;border:1px solid #505967;border-radius:6px;background:#151922;color:#fff;padding:0 9px;font-size:13px}.rank-form button{width:100%}.rank-status{font-size:10px;color:#c0c7d1;min-height:14px}.personal-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 8px}.personal-stat{background:#0c1016;border:1px solid #303846;border-radius:8px;padding:8px;text-align:center}.personal-stat-label{font-size:8px;letter-spacing:.1em;color:#8993a1}.personal-stat-value{font-size:15px;font-weight:950;color:#ffd43b;margin-top:3px;font-variant-numeric:tabular-nums}.leaderboard{width:100%;max-width:310px;text-align:left;margin:7px 0 2px;padding:7px;background:linear-gradient(160deg,#171d27,#10141b);border:1px solid #343d4b;border-radius:12px;font-size:11px;box-shadow:0 8px 24px #0005}.leaderboard h3{margin:0;text-align:center;color:#ffd43b;font-size:13px;letter-spacing:.16em;font-weight:950}.leader-subtitle{text-align:center;color:#7f8998;font-size:8px;letter-spacing:.12em;margin:3px 0 10px}.leader-columns{display:grid;grid-template-columns:32px minmax(0,1fr) 76px;gap:7px;padding:0 7px 5px;color:#7f8998;font-size:8px;letter-spacing:.1em;border-bottom:1px solid #343d4b}.leader-columns span:last-child{text-align:right}.leader-row{display:grid;grid-template-columns:32px minmax(0,1fr) 76px;align-items:center;gap:7px;padding:7px;border-bottom:1px solid #282f3a;border-radius:5px;min-height:31px}.leader-row:last-child{border-bottom:0}.leader-row.my-rank-row{outline:1px solid #ffd43b66;background:#ffd43b0d}.leader-row.top-rank{background:linear-gradient(90deg,#ffd43b12,transparent 80%)}.leader-rank{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:#252d39;color:#b8c0cb;font-size:10px;font-weight:900}.leader-row.rank-1 .leader-rank{background:#ffd43b;color:#151515}.leader-row.rank-2 .leader-rank{background:#c8d0db;color:#15191f}.leader-row.rank-3 .leader-rank{background:#c98551;color:#17100b}.leader-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:750;color:#f1f3f6}.leader-score{font-size:12px;text-align:right;font-weight:950;color:#ffd43b;font-variant-numeric:tabular-nums}.leader-empty,.leader-error{padding:12px 4px;text-align:center;color:#aeb7c4;line-height:1.5}.rank-actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pause-cover{position:absolute;inset:3px;background:#090b10f2;z-index:8;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:950;font-size:26px;border-radius:6px}.pause-actions{display:flex;flex-direction:column;gap:9px;width:min(82%,230px)}.pause-actions button{height:42px;font-size:14px}.pause-actions .resume{background:#ffd43b;color:#111}.pause-actions .return{background:#343b47;color:#fff}
.pause-cover.show{display:flex}
@media(max-height:500px){
 .subtitle,.help{display:none}
 .app{gap:2px}
 .hud{padding:2px 8px}
 .utility{height:25px!important}
}
</style>

<body>
<main class="app">
  <h1>MAYAMA</h1>
  <div class="subtitle">CONNECT LETTERS. MAKE MAYAMA.</div>
  <section class="hud">
    <div><small>SCORE</small><div class="score" id="score">0</div></div>
    <div class="chain" id="chain"></div>
  </section>
  <div class="play-area" id="playArea">
    <div class="board" id="board">
      <div class="grid" id="grid"></div><div class="fx-layer" id="fxLayer"></div>
      <div class="pause-cover" id="pauseCover"><div>PAUSED</div><div class="pause-actions"><button class="resume" id="resumeBtn">RESUME</button><button class="return" id="restartBtn">BACK TO TITLE</button></div></div>
      <div class="overlay" id="startOverlay">
        <h2 id="overlayTitle">MAYAMA</h2>
        <p id="overlayText"><span class="quick-rule">1</span> Move the falling letters<br><span class="quick-rule">2</span> Connect <b>M-A-Y-A-M-A</b> in order<br><span class="quick-rule">3</span> Clear letters to score points</p>
        <div id="modePicker" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px"><button id="easyModeBtn">EASY MODE</button><button id="normalModeBtn" class="secondary">NORMAL MODE</button></div><div id="modeDescription" style="font-size:10px;color:#aeb7c4;margin-bottom:8px">EASY: AUTO HINT · CONSTANT SPEED</div><button id="startBtn">START EASY</button>
        <button id="rankingBtn" class="secondary">GLOBAL RANKING</button>
        <div id="rankForm" class="rank-form"><input id="nicknameInput" maxlength="16" placeholder="Nickname (1–16 characters)" autocomplete="nickname"><button id="submitScoreBtn">SUBMIT SCORE</button><div id="rankStatus" class="rank-status"></div></div>
        <div id="leaderboard" class="leaderboard" hidden></div>
      </div>
    </div>
    <aside class="side">
      <div class="next-title">NEXT</div>
      <div class="preview" id="next0"></div>
      <div class="preview" id="next1"></div>
      <div class="preview" id="next2"></div>
    </aside>
  </div>
  <div class="controls">
    <div class="control-group move-group">
      <div class="control-label" style="grid-column:1 / -1">MOVE</div>
      <button data-a="left" aria-label="Move left">←</button>
      <button data-a="down" aria-label="Soft drop one cell">↓</button>
      <button data-a="right" aria-label="Move right">→</button>
    </div>
    <div class="control-group action-group">
      <div class="control-label" style="grid-column:1 / -1">ACTIONS</div>
      <button data-a="rotate" aria-label="Rotate">↻</button>
      <button data-a="drop" aria-label="Hard drop">⤓</button>
    </div>
  </div>
  <div class="bottom-row">
    <button class="utility" id="hintBtn">HINT</button><button class="utility" id="pauseBtn">PAUSE</button>
  </div>
  <div class="help">MOVE: ← ↓ →　ACTIONS: ROTATE ↻ / SOFT DROP ↓ / HARD DROP ⤓</div>
</main>
<script>
const W=8,H=14,TARGET="MAYAMA";
let board=[],piece=null,queue=[],score=0,busy=false,started=false,paused=false,gameOver=false,timer=null;
let mayamaCount=0,maxChain=0;
const SUPABASE_URL="https://yifwxuznctajopwcnlge.supabase.co";
const SUPABASE_KEY="sb_publishable_vsGxHWY15qN5AWnINc-zVA_dRpjC6WD";
let scoreSubmitted=false;
let gameMode="normal";
let replaySeed=1,replayActions=[],rngState=1,letterBag=[],hintEnabled=false;
function seededRandom(){rngState=(rngState+0x6D2B79F5)|0;let t=rngState;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}
function recordAction(a){if(replayActions.length<30000)replayActions.push(a)}
const PLAYER_ID_KEY="mayama-player-id-v1";
const NICKNAME_KEY="mayama-nickname-v1";
function getPlayerId(){
 try{
  let id=localStorage.getItem(PLAYER_ID_KEY);
  if(!id){id=(crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)}));localStorage.setItem(PLAYER_ID_KEY,id)}
  return id;
 }catch(e){return ""}
}
const playerId=getPlayerId();
const nicknameInput=document.getElementById("nicknameInput");
try{nicknameInput.value=localStorage.getItem(NICKNAME_KEY)||""}catch(e){}
nicknameInput.addEventListener("input",()=>{
 try{localStorage.setItem(NICKNAME_KEY,nicknameInput.value.trim())}catch(e){}
});

function randLetter(){
 // Balanced shuffled bag: exactly 3 A, 2 M and 1 Y per six letters.
 // This preserves the intended long-run ratio while reducing short streaks.
 if(!letterBag.length){
  letterBag=["A","A","A","M","M","Y"];
  for(let i=letterBag.length-1;i>0;i--){const j=Math.floor(seededRandom()*(i+1));[letterBag[i],letterBag[j]]=[letterBag[j],letterBag[i]]}
 }
 return letterBag.pop();
}
function makePiece(){return {x:3,y:0,r:0,letters:[randLetter(),randLetter()],id:Math.random().toString(36).slice(2)}}
function refillQueue(){while(queue.length<4)queue.push(makePiece())}
function emptyBoard(){return Array.from({length:H},()=>Array(W).fill(null))}
function cellsOf(p){
 const a=p.letters[0],b=p.letters[1],r=p.r%4;
 // Letter identity is preserved through all four orientations.
 if(r===0)return [{x:p.x,y:p.y,l:a},{x:p.x,y:p.y+1,l:b}];
 if(r===1)return [{x:p.x+1,y:p.y,l:a},{x:p.x,y:p.y,l:b}];
 if(r===2)return [{x:p.x,y:p.y+1,l:a},{x:p.x,y:p.y,l:b}];
 return [{x:p.x,y:p.y,l:a},{x:p.x+1,y:p.y,l:b}];
}
function valid(p){return cellsOf(p).every(c=>c.x>=0&&c.x<W&&c.y>=0&&c.y<H&&!board[c.y][c.x])}
function findHintPath(){
 let best=[];
 for(let sy=0;sy<H;sy++)for(let sx=0;sx<W;sx++){
  const cell=board[sy][sx];if(!cell)continue;
  for(let start=0;start<TARGET.length;start++){
   if(cell.l!==TARGET[start])continue;
   function walk(x,y,index,path){
    if(path.length>best.length)best=path;
    if(index>=TARGET.length-1)return;
    for(const [nx,ny] of neighbors(x,y)){
     const next=board[ny][nx];if(!next||next.l!==TARGET[index+1]||path.some(([px,py])=>px===nx&&py===ny))continue;
     walk(nx,ny,index+1,path.concat([[nx,ny]]));
    }
   }
   walk(sx,sy,start,[[sx,sy]]);
  }
 }
 return best.length>=2?new Set(best.map(([x,y])=>x+","+y)):new Set();
}
function render(matches=[]){
 const grid=document.getElementById("grid");grid.innerHTML="";
 const hintCells=(gameMode==="easy"||hintEnabled)?findHintPath():new Set();
 const falling=new Map(piece?cellsOf(piece).map(c=>[c.x+","+c.y,c]):[]);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const el=document.createElement("div");el.className="cell";const key=x+","+y;
  if(board[y][x])el.textContent=board[y][x].l;
  if(falling.has(key)){el.textContent=falling.get(key).l;el.classList.add("falling")}
  if(hintCells.has(key))el.classList.add("hint");
  if(matches.includes(key))el.classList.add("flash");
  grid.appendChild(el);
 }
 document.getElementById("score").textContent=score;
 [0,1,2].forEach(i=>{
  const box=document.getElementById("next"+i);box.innerHTML="";
  const p=queue[i];
  if(p){p.letters.forEach(l=>{const d=document.createElement("span");d.className="mini";d.textContent=l;box.appendChild(d)})}
  else box.innerHTML='<span class="mini empty">?</span><span class="mini empty">?</span>';
 });
}
function move(dx){if(!started||paused||gameOver||busy)return;recordAction(dx<0?"L":"R");const q={...piece,x:piece.x+dx};if(valid(q)){piece=q;render()}}
function rotate(){
 if(!started||paused||gameOver||busy)return;
 recordAction("T");
 const q={...piece,r:(piece.r+1)%4};
 if(valid(q)){piece=q;render();return}
 for(const dx of [-1,1,-2,2]){const shifted={...q,x:q.x+dx};if(valid(shifted)){piece=shifted;render();return}}
}
function softDrop(){if(!started||paused||gameOver||busy)return;recordAction("D");const q={...piece,y:piece.y+1};if(valid(q)){piece=q;render()}else lockPiece()}
function hardDrop(){if(!started||paused||gameOver||busy)return;recordAction("H");while(valid({...piece,y:piece.y+1}))piece.y++;render();lockPiece()}
function lockPiece(){
 const cs=cellsOf(piece);
 if(!cs.every(c=>c.y>=0&&c.y<H)){endGame();return}
 cs.forEach(c=>board[c.y][c.x]={l:c.l,id:Math.random().toString(36).slice(2)});
 // The two cells become independent immediately after locking.
 settleCells();
 piece=queue.shift();refillQueue();
 if(!valid(piece)){render();endGame();return}
 render();resolveMatches();
}
function settleCells(){
 let moved=true;
 while(moved){
  moved=false;
  for(let y=H-2;y>=0;y--)for(let x=0;x<W;x++){
   if(board[y][x]&&!board[y+1][x]){board[y+1][x]=board[y][x];board[y][x]=null;moved=true}
  }
 }
}
function neighbors(x,y){return [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([a,b])=>a>=0&&a<W&&b>=0&&b<H)}
function findMatches(){
 const found=new Set();let pathCount=0;
 for(let sy=0;sy<H;sy++)for(let sx=0;sx<W;sx++){
  if(!board[sy][sx]||board[sy][sx].l!=="M")continue;
  function dfs(x,y,i,path){
   if(i===TARGET.length-1){pathCount++;path.forEach(([a,b])=>found.add(a+","+b));return}
   for(const [nx,ny] of neighbors(x,y)){
    if(!board[ny][nx]||board[ny][nx].l!==TARGET[i+1]||path.some(([a,b])=>a===nx&&b===ny))continue;
    dfs(nx,ny,i+1,path.concat([[nx,ny]]))
   }
  }
  dfs(sx,sy,0,[[sx,sy]])
 }
 return {cells:[...found],count:pathCount}
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function playClearFX(matches,chain){
 const boardEl=document.getElementById("board"),layer=document.getElementById("fxLayer");
 boardEl.classList.remove("clear-shake");void boardEl.offsetWidth;boardEl.classList.add("clear-shake");
 layer.innerHTML="";
 const label=document.createElement("div");label.className="clear-callout"+(chain>1?" combo":"");label.textContent=chain>1?`CHAIN ×${chain}!`:"MAYAMA!";layer.appendChild(label);
 const grid=document.getElementById("grid"),cells=[...grid.children];
 matches.forEach(key=>{
  const [x,y]=key.split(",").map(Number),cell=cells[y*W+x];if(!cell)return;
  const cx=cell.offsetLeft+cell.offsetWidth/2,cy=cell.offsetTop+cell.offsetHeight/2;
  for(let i=0;i<4;i++){
   const particle=document.createElement("span");particle.className="fx-particle"+(i%3===0?" white":"");
   const angle=(Math.PI*2*i/4)+(Math.random()-.5)*.5,dist=16+Math.random()*24;
   particle.style.left=`${cx}px`;particle.style.top=`${cy}px`;
   particle.style.setProperty("--dx",`${Math.cos(angle)*dist}px`);particle.style.setProperty("--dy",`${Math.sin(angle)*dist}px`);
   layer.appendChild(particle);
  }
 });
 setTimeout(()=>{boardEl.classList.remove("clear-shake");layer.innerHTML=""},760);
}
async function resolveMatches(){
 busy=true;let chain=0;
 while(true){
  const result=findMatches();if(!result.cells.length)break;
   const matches=result.cells;
   chain++;mayamaCount+=result.count;maxChain=Math.max(maxChain,chain);
  document.getElementById("chain").textContent=chain>1?`${chain} CHAIN!`:"";
  render(matches);
  playClearFX(matches,chain);
  await wait(430);
  matches.forEach(key=>{const[x,y]=key.split(",").map(Number);board[y][x]=null});
  score+=matches.length*100*chain;settleCells();render();await wait(130);
 }
 document.getElementById("chain").textContent="";busy=false;
}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function startTimer(){
 stopTimer();
  // Speed follows score: start at 1000 ms per row and accelerate to 150 ms.
 timer=setInterval(()=>{
  if(!started||paused||gameOver||busy)return;
   const dropDelay=gameMode==="easy"?700:Math.max(150,1000-score*0.1);
  const now=Date.now();
  if(now-lastDropAt>=dropDelay){lastDropAt=now;softDrop()}
 },40);
}
function startGame(){
 replaySeed=(crypto.getRandomValues(new Uint32Array(1))[0]||Math.floor(Math.random()*4294967295))>>>0; if(replaySeed===0)replaySeed=1; rngState=replaySeed; letterBag=[]; replayActions=[];
 board=emptyBoard();queue=[];refillQueue();piece=queue.shift();refillQueue();
 score=0;mayamaCount=0;maxChain=0;scoreSubmitted=false;busy=false;paused=false;gameOver=false;started=true;hintEnabled=(gameMode==="easy");document.getElementById("hintBtn").style.display=gameMode==="easy"?"none":"";document.getElementById("hintBtn").textContent="HINT";
 gameStartAt=Date.now();pausedAt=0;pausedTotal=0;lastDropAt=gameStartAt;
 document.getElementById("startOverlay").classList.add("hidden");
 document.getElementById("rankForm").classList.remove("show");
 document.getElementById("leaderboard").hidden=true;
 document.getElementById("pauseCover").classList.remove("show");
 document.getElementById("pauseBtn").textContent="PAUSE";
 render();startTimer();
}
function togglePause(){
 if(!started||gameOver)return;
 paused=!paused;
 if(paused){pausedAt=Date.now()}else if(pausedAt){pausedTotal+=Date.now()-pausedAt;pausedAt=0;lastDropAt=Date.now()}
 document.getElementById("pauseCover").classList.toggle("show",paused);
 document.getElementById("pauseBtn").textContent=paused?"RESUME":"PAUSE";
}
function endGame(){
 gameOver=true;stopTimer();started=false;
 const overlay=document.getElementById("startOverlay");
 overlay.classList.remove("hidden");
 document.getElementById("overlayTitle").textContent="GAME OVER";
  document.getElementById("overlayText").innerHTML=`<span class="result-stats">SCORE: ${score}<br>MAYAMA CLEARS: ${mayamaCount}<br>MAX CHAIN: ${maxChain}</span><br><br>SUBMIT YOUR SCORE TO THE GLOBAL RANKING`;
 document.getElementById("startBtn").textContent="PLAY AGAIN";
 document.getElementById("rankingBtn").classList.add("secondary");
 document.getElementById("rankForm").classList.add("show");
 document.getElementById("rankStatus").textContent="";
 document.getElementById("submitScoreBtn").disabled=false;
 document.getElementById("submitScoreBtn").textContent="SUBMIT SCORE";
 // Keep the leaderboard collapsed initially so the score submission form
 // remains visible on short screens. Players can open it with GLOBAL RANKING.
 document.getElementById("leaderboard").hidden=true;
 render();
}
async function loadLeaderboard(){
 const box=document.getElementById("leaderboard");
 box.hidden=false;box.replaceChildren();
 const heading=document.createElement("h3");heading.textContent="GLOBAL LEADERBOARD";box.appendChild(heading);
 const subtitle=document.createElement("div");subtitle.className="leader-subtitle";subtitle.textContent=`${gameMode.toUpperCase()} MODE · BEST SCORE PER PLAYER · TOP 10`;box.appendChild(subtitle);
 const stats=document.createElement("div");stats.className="personal-stats";
 stats.innerHTML='<div class="personal-stat"><div class="personal-stat-label">YOUR BEST</div><div class="personal-stat-value" id="myBest">—</div></div><div class="personal-stat"><div class="personal-stat-label">YOUR RANK</div><div class="personal-stat-value" id="myRank">—</div></div>';
 box.appendChild(stats);
 const loading=document.createElement("div");loading.className="leader-empty";loading.textContent="Loading leaderboard…";box.appendChild(loading);
 try{
  const headers={apikey:SUPABASE_KEY,"Content-Type":"application/json"};
  const [rankResponse,statsResponse]=await Promise.all([
   fetch(`${SUPABASE_URL}/rest/v1/rpc/get_leaderboard_for_mode`,{method:"POST",headers,body:JSON.stringify({p_mode:gameMode})}),
   fetch(`${SUPABASE_URL}/rest/v1/rpc/get_player_stats_for_mode`,{method:"POST",headers,body:JSON.stringify({p_player_id:playerId,p_mode:gameMode})})
  ]);
  if(!rankResponse.ok)throw new Error(`Leaderboard HTTP ${rankResponse.status}`);
  if(!statsResponse.ok)throw new Error(`Stats HTTP ${statsResponse.status}`);
  const rows=await rankResponse.json();const personal=await statsResponse.json();
  const bestEl=stats.querySelector("#myBest"),rankEl=stats.querySelector("#myRank");
  if(personal&&personal.best_score!==null&&personal.best_score!==undefined){bestEl.textContent=Number(personal.best_score).toLocaleString();rankEl.textContent=personal.rank?`#${personal.rank}`:"—"}
  else {bestEl.textContent="—";rankEl.textContent="Not ranked"}
  // When the current player appears in the displayed leaderboard, use that exact row rank
  // so the personal rank card cannot disagree with the leaderboard ordering.
  const ownRow=rows.find(row=>row.player_id===playerId);
  if(ownRow)rankEl.textContent=`#${Number(ownRow.rank)}`;
  box.replaceChildren(heading,subtitle,stats);
  if(!rows.length){const empty=document.createElement("div");empty.className="leader-empty";empty.textContent="No scores yet. Be the first to claim the top spot!";box.appendChild(empty);return}
  const columns=document.createElement("div");columns.className="leader-columns";columns.innerHTML="<span>RANK</span><span>PLAYER</span><span>SCORE</span>";box.appendChild(columns);
  rows.forEach(row=>{const rank=Number(row.rank);const line=document.createElement("div");line.className=`leader-row${rank<=3?` top-rank rank-${rank}`:""}${row.player_id===playerId?" my-rank-row":""}`;const rankEl=document.createElement("span");rankEl.className="leader-rank";rankEl.textContent=String(rank).padStart(2,"0");const name=document.createElement("span");name.className="leader-name";name.textContent=row.nickname+(row.player_id===playerId?" (YOU)":"");const points=document.createElement("span");points.className="leader-score";points.textContent=Number(row.score).toLocaleString();line.append(rankEl,name,points);box.appendChild(line)});
 }catch(err){box.replaceChildren(heading,subtitle);const msg=document.createElement("div");msg.className="leader-error";msg.textContent="Could not load leaderboard. Please check the Supabase setup, then refresh.";box.appendChild(msg)}
}
async function submitScore(){
 if(scoreSubmitted)return;
 const input=document.getElementById("nicknameInput");const nickname=input.value.trim();const status=document.getElementById("rankStatus");
 if(!nickname||nickname.length>16){status.textContent="Enter a nickname (1–16 characters).";return}
 try{localStorage.setItem(NICKNAME_KEY,nickname)}catch(e){}
 if(!playerId){status.textContent="Could not create a player ID in this browser.";return}
 const button=document.getElementById("submitScoreBtn");button.disabled=true;button.textContent="SUBMITTING…";status.textContent="";
 try{
  const response=await fetch(`${SUPABASE_URL}/functions/v1/submit-score`,{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({nickname,score,mayama_clears:mayamaCount,max_chain:maxChain,player_id:playerId,replay_seed:replaySeed,replay_actions:replayActions,mode:gameMode})});
  if(!response.ok){const detail=await response.text();throw new Error(detail||`HTTP ${response.status}`)}
  scoreSubmitted=true;status.textContent="Score submitted!";button.textContent="SUBMITTED";await loadLeaderboard();
 }catch(err){status.textContent=err.message&&err.message.includes("15 seconds")?"Please wait a few seconds before submitting again.":"Submission failed. Check that the V20 validation function is deployed, then try again.";button.disabled=false;button.textContent="TRY AGAIN"}
}
document.getElementById("submitScoreBtn").addEventListener("click",submitScore);
document.getElementById("rankingBtn").addEventListener("click",()=>{const box=document.getElementById("leaderboard");box.hidden=!box.hidden;if(!box.hidden)loadLeaderboard()});

document.querySelectorAll("[data-a]").forEach(btn=>btn.addEventListener("click",()=>{
 const a=btn.dataset.a;if(a==="left")move(-1);if(a==="right")move(1);if(a==="rotate")rotate();if(a==="down")softDrop();if(a==="drop")hardDrop()
}));
function selectMode(mode){
 gameMode=mode;
 document.getElementById("easyModeBtn").classList.toggle("secondary",mode!=="easy");
 document.getElementById("normalModeBtn").classList.toggle("secondary",mode!=="normal");
 document.getElementById("modeDescription").textContent=mode==="easy"?"EASY: AUTO HINT · CONSTANT SPEED":"NORMAL: NO HINT · SPEED INCREASES WITH SCORE";
 document.getElementById("startBtn").textContent=mode==="easy"?"START EASY":"START NORMAL";
 document.getElementById("leaderboard").hidden=true;
}
document.getElementById("easyModeBtn").addEventListener("click",()=>selectMode("easy"));
document.getElementById("normalModeBtn").addEventListener("click",()=>selectMode("normal"));
document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("pauseBtn").addEventListener("click",togglePause);
document.getElementById("hintBtn").addEventListener("click",()=>{
 hintEnabled=!hintEnabled;
 document.getElementById("hintBtn").textContent=hintEnabled?"HIDE HINT":"HINT";
 render();
});
document.getElementById("resumeBtn").addEventListener("click",togglePause);
document.getElementById("restartBtn").addEventListener("click",()=>{
 // Reset is intentionally tucked inside the pause screen and requires explicit confirmation.
 const ok=window.confirm("End this game and return to the title screen?\nYour score will be lost.");
 if(!ok)return;
 stopTimer();started=false;paused=false;gameOver=false;
 document.getElementById("pauseCover").classList.remove("show");
 document.getElementById("pauseBtn").textContent="PAUSE";
 document.getElementById("overlayTitle").textContent="MAYAMA";
 document.getElementById("overlayText").innerHTML="HOW TO PLAY<br>Move and rotate the falling pairs.<br>Connect M-A-Y-A-M-A in order, using up, down, left or right.<br>Matched letters disappear and earn points.<br>Clear chains for bonus points. The more you score, the faster pieces fall!";
 document.getElementById("startBtn").textContent=gameMode==="easy"?"START EASY":"START NORMAL";
 document.getElementById("rankForm").classList.remove("show");
 document.getElementById("leaderboard").hidden=true;
 document.getElementById("overlayTitle").textContent="MAYAMA";
 document.getElementById("startOverlay").classList.remove("hidden");
 board=emptyBoard();queue=[];refillQueue();piece=queue.shift();refillQueue();score=0;render();
});
document.getElementById("rankingBtn").classList.add("secondary");
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"){e.preventDefault();move(-1)}
 else if(e.key==="ArrowRight"){e.preventDefault();move(1)}
 else if(e.key==="ArrowUp"){e.preventDefault();rotate()}
 else if(e.key==="ArrowDown"){e.preventDefault();softDrop()}
 else if(e.code==="Space"){e.preventDefault();hardDrop()}
 else if(e.key==="Escape"||e.key.toLowerCase()==="p")togglePause()
});
board=emptyBoard();refillQueue();piece=queue.shift();refillQueue();selectMode("normal");render();
</script>
