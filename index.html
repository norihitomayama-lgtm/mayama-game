<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MAYAMA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0d12;--panel:#151922;--line:#303744;--yellow:#ffd43b;--white:#f7f8fa}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center;overflow:hidden}
.app{width:min(100vw,520px);padding:18px 14px max(20px,env(safe-area-inset-bottom));}
.title{text-align:center;font-size:30px;font-weight:900;letter-spacing:.18em;margin:0 0 2px}
.desc{text-align:center;color:#9da5b2;font-size:11px;margin-bottom:12px}
.hud{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px 14px;margin-bottom:9px}
.hud small{display:block;color:#8f97a5;font-size:9px;letter-spacing:.12em}
.score{font-size:21px;font-weight:800}
.chain{font-weight:900;color:var(--yellow);font-size:15px;min-width:95px;text-align:right}
.board-wrap{position:relative;width:max-content;margin:auto;padding:5px;border:1px solid #3b424e;border-radius:13px;background:#080a0e;box-shadow:0 15px 45px #0009}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:min(88vw,392px);aspect-ratio:8/14}
.cell{background:#252b35;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,6vw,28px);font-weight:950;color:#fff;line-height:1}
.cell.falling{background:var(--yellow);color:#101216;box-shadow:inset 0 0 0 2px #fff;z-index:2}
.cell.flash{background:#fff;color:#111;animation:pop .18s ease-in forwards}
@keyframes pop{to{transform:scale(.2);opacity:0}}
.overlay{display:none;position:absolute;inset:5px;border-radius:9px;background:#090b0eeF;z-index:10;align-items:center;justify-content:center;flex-direction:column}
.overlay.show{display:flex}
.over{font-size:29px;font-weight:900}.final{color:var(--yellow);margin:8px 0 18px;font-weight:800}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px auto 0;width:min(88vw,392px)}
button{appearance:none;border:0;border-radius:11px;background:#252b35;color:#fff;font-size:24px;font-weight:900;height:52px;box-shadow:0 2px 0 #111;touch-action:manipulation}
button:active{transform:translateY(1px);background:#353d4b}
.restart{font-size:14px;padding:0 24px;width:auto;height:46px}
.help{text-align:center;color:#737c89;font-size:10px;margin-top:9px}
</style>
</head>
<body>
<main class="app">
<h1 class="title">MAYAMA</h1>
<div class="desc">M・A・Y をつないで MAYAMA を作る</div>
<section class="hud">
  <div><small>SCORE</small><div class="score" id="score">0</div></div>
  <div class="chain" id="chain"></div>
</section>
<div class="board-wrap">
  <div id="grid" class="grid"></div>
  <div id="overlay" class="overlay">
    <div class="over">GAME OVER</div>
    <div class="final">SCORE <span id="finalScore">0</span></div>
    <button class="restart" id="restart">もう一度</button>
  </div>
</div>
<div class="controls">
<button data-act="left">←</button><button data-act="rotate">↻</button><button data-act="down">↓</button><button data-act="right">→</button><button data-act="drop">⤓</button>
</div>
<div class="help">左右：移動　↻：回転　↓：1段落下　⤓：即落下</div>
</main>
<script>
const W=8,H=14,TARGET="MAYAMA";
let board=[],piece=null,score=0,gameOver=false,busy=false,timer=null;

function empty(){return Array.from({length:H},()=>Array(W).fill(null))}
function rnd(){return "MAY"[Math.floor(Math.random()*3)]}
function makePiece(){return{x:3,y:0,r:0,l:[rnd(),rnd()],id:Math.random().toString(36).slice(2)}}
function cells(p){return p.r%2===0?[{x:p.x,y:p.y},{x:p.x,y:p.y+1}]:[{x:p.x,y:p.y},{x:p.x+1,y:p.y}]}
function valid(p){return cells(p).every(c=>c.x>=0&&c.x<W&&c.y>=0&&c.y<H&&!board[c.y][c.x])}
function render(match=[]){
 const g=document.getElementById("grid");g.innerHTML="";
 const f=new Map(cells(piece).map((c,i)=>[c.x+","+c.y,{...c,l:piece.l[i]}]));
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const d=document.createElement("div");d.className="cell";const k=x+","+y;
  if(board[y][x])d.textContent=board[y][x].l;
  if(f.has(k)){d.textContent=f.get(k).l;d.classList.add("falling")}
  if(match.includes(k))d.classList.add("flash");
  g.appendChild(d);
 }
 document.getElementById("score").textContent=score;
}
function move(dx){if(gameOver||busy)return;let q={...piece,x:piece.x+dx};if(valid(q)){piece=q;render()}}
function rotate(){
 if(gameOver||busy)return;let q={...piece,r:(piece.r+1)%4};
 if(valid(q)){piece=q;render();return}
 for(const dx of [-1,1,-2,2]){let z={...q,x:q.x+dx};if(valid(z)){piece=z;render();return}}
}
function down(){if(gameOver||busy)return;let q={...piece,y:piece.y+1};if(valid(q)){piece=q;render()}else lock()}
function drop(){if(gameOver||busy)return;while(valid({...piece,y:piece.y+1}))piece.y++;render();lock()}
function lock(){
 const cs=cells(piece);cs.forEach((c,i)=>board[c.y][c.x]={l:piece.l[i],id:piece.id});
 piece=makePiece();if(!valid(piece)){end();return}render();resolve();
}
function nb(x,y){return[[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([a,b])=>a>=0&&a<W&&b>=0&&b<H)}
function matches(){
 const found=new Set();
 for(let sy=0;sy<H;sy++)for(let sx=0;sx<W;sx++){
  if(!board[sy][sx]||board[sy][sx].l!=="M")continue;
  const dfs=(x,y,i,path)=>{
   if(i===5){path.forEach(([a,b])=>found.add(a+","+b));return}
   for(const [nx,ny] of nb(x,y)){
    if(!board[ny][nx]||board[ny][nx].l!==TARGET[i+1]||path.some(([a,b])=>a===nx&&b===ny))continue;
    dfs(nx,ny,i+1,[...path,[nx,ny]]);
   }
  };
  dfs(sx,sy,0,[[sx,sy]]);
 }
 return [...found];
}
function gravity(){
 for(let x=0;x<W;x++){
  const a=[];for(let y=H-1;y>=0;y--)if(board[y][x])a.push(board[y][x]);
  for(let y=H-1;y>=0;y--)board[y][x]=a[H-1-y]||null;
 }
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function resolve(){
 busy=true;let chain=0;
 while(true){
  const m=matches();if(!m.length)break;
  chain++;document.getElementById("chain").textContent=chain>1?`${chain} CHAIN ×`:"";
  render(m);await wait(180);
  m.forEach(k=>{const[x,y]=k.split(",").map(Number);board[y][x]=null});
  score+=m.length*100*chain;render();await wait(80);gravity();render();await wait(90);
 }
 document.getElementById("chain").textContent="";busy=false;
}
function end(){gameOver=true;clearInterval(timer);document.getElementById("finalScore").textContent=score;document.getElementById("overlay").classList.add("show");render()}
function restart(){
 board=empty();piece=makePiece();score=0;gameOver=false;busy=false;
 document.getElementById("overlay").classList.remove("show");document.getElementById("chain").textContent="";
 render();clearInterval(timer);timer=setInterval(down,650);
}
document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{
 const a=b.dataset.act;if(a==="left")move(-1);if(a==="right")move(1);if(a==="rotate")rotate();if(a==="down")down();if(a==="drop")drop();
}));
document.getElementById("restart").addEventListener("click",restart);
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"){e.preventDefault();move(-1)}else if(e.key==="ArrowRight"){e.preventDefault();move(1)}
 else if(e.key==="ArrowUp"){e.preventDefault();rotate()}else if(e.key==="ArrowDown"){e.preventDefault();down()}
 else if(e.code==="Space"){e.preventDefault();drop()}else if(e.key.toLowerCase()==="r")restart();
});
restart();
</script>
</body>
</html>
